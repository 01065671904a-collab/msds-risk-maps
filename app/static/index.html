<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSDS 유해화학물질 통합관리</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; margin: 20px; color: #1f2937; }
    h1 { font-size: 20px; margin: 0 0 12px 0; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    button { padding: 6px 12px; border: 1px solid #9ca3af; background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; }
    button:hover { background: #f3f4f6; }
    button.primary { background: #193b50; color: #fff; border-color: #193b50; }
    button.primary:hover { background: #122b3b; }
    .status { font-size: 13px; color: #374151; margin-bottom: 10px; }
    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid #d1d5db; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #d1d5db; padding: 5px 6px; text-align: left; white-space: nowrap; }
    th { background: #f9fafb; font-weight: 600; }
    input[type="text"], select { width: 100%; min-width: 72px; padding: 3px 4px; border: 1px solid #d1d5db; border-radius: 3px; font-size: 12px; }
    input.wide { min-width: 140px; }
  </style>
</head>
<body>
  <h1>MSDS 유해화학물질 통합관리</h1>

  <div class="bar">
    <input type="file" id="pdfInput" accept=".pdf" />
    <button class="primary" id="btnExtract">PDF 추출</button>
    <button id="btnLookup">선택 행 KOSHA 조회</button>
    <button id="btnAddRow">행 추가</button>
    <button id="btnDeleteSelected">선택 행 삭제</button>
    <button id="btnExportXlsx">엑셀 다운로드</button>
    <button id="btnExportPdf">PDF 다운로드</button>
  </div>

  <div class="status" id="statusText">준비됨</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="chkAll" checked /></th>
          <th>공정명</th>
          <th>제품명</th>
          <th>원본 물질명</th>
          <th>KOSHA 물질명</th>
          <th>CAS No.</th>
          <th>함유량</th>
          <th>C (발암성)</th>
          <th>M (변이원성)</th>
          <th>R (생식독성)</th>
          <th>노출기준</th>
          <th>끓는점 (℃)</th>
          <th>작업환경측정</th>
          <th>특수건강진단</th>
          <th>관리대상유해물질</th>
          <th>특별관리물질</th>
          <th>H-Code</th>
          <th>위험등급</th>
          <th>조회상태</th>
          <th>법령근거</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    let rows = [];

    const cols = [
      "process", "product", "original_name", "kosha_name", "cas", "content",
      "cmr_c", "cmr_m", "cmr_r", "exposure_limit", "boiling_point",
      "work_measurement", "special_health_exam", "managed_substance", "specially_managed",
      "h_codes", "grade", "kosha_status", "legal_basis"
    ];

    const ynKeys = ["work_measurement", "special_health_exam", "managed_substance", "specially_managed"];

    async function readJsonSafe(res) {
      const text = await res.text();
      if (!text || !text.trim()) {
        throw new Error(`서버 응답이 비어 있습니다 (HTTP ${res.status})`);
      }
      try {
        return JSON.parse(text);
      } catch {
        throw new Error(`JSON 파싱 오류 (HTTP ${res.status}): ${text.slice(0, 120)}`);
      }
    }

    function setStatus(msg) {
      el("statusText").textContent = msg;
    }

    function render() {
      el("tbody").innerHTML = rows.map((r, i) => {
        const cells = cols.map((k) => {
          if (ynKeys.includes(k)) {
            const cur = r[k] || "미확인";
            const opts = ["미확인", "Y", "N"].map((v) => `<option value="${v}" ${cur === v ? "selected" : ""}>${v}</option>`).join("");
            return `<td><select data-i="${i}" data-k="${k}">${opts}</select></td>`;
          }
          const cls = ["original_name", "kosha_name", "exposure_limit", "legal_basis"].includes(k) ? `class="wide"` : "";
          return `<td><input type="text" ${cls} data-i="${i}" data-k="${k}" value="${esc(r[k] ?? "")}" /></td>`;
        }).join("");

        return `
          <tr>
            <td><input type="checkbox" class="row-chk" data-i="${i}" ${r.selected !== false ? "checked" : ""} /></td>
            ${cells}
            <td><button class="row-del" data-i="${i}">삭제</button></td>
          </tr>
        `;
      }).join("");
    }

    el("tbody").addEventListener("input", (e) => {
      const i = Number(e.target.dataset.i);
      const k = e.target.dataset.k;
      if (!Number.isNaN(i) && k && rows[i]) {
        rows[i][k] = e.target.value;
      }
    });

    el("tbody").addEventListener("change", (e) => {
      const i = Number(e.target.dataset.i);
      const k = e.target.dataset.k;
      if (e.target.classList.contains("row-chk") && !Number.isNaN(i) && rows[i]) {
        rows[i].selected = e.target.checked;
        return;
      }
      if (!Number.isNaN(i) && k && rows[i]) {
        rows[i][k] = e.target.value;
      }
    });

    el("tbody").addEventListener("click", (e) => {
      if (e.target.classList.contains("row-del")) {
        const i = Number(e.target.dataset.i);
        if (!Number.isNaN(i)) {
          rows.splice(i, 1);
          render();
        }
      }
    });

    el("chkAll").addEventListener("change", (e) => {
      rows.forEach((r) => { r.selected = e.target.checked; });
      render();
    });

    el("btnAddRow").addEventListener("click", () => {
      rows.push({
        selected: true, process: "", product: "", original_name: "", kosha_name: "미확인",
        cas: "", content: "", cmr_c: "미확인", cmr_m: "미확인", cmr_r: "미확인",
        exposure_limit: "미확인", boiling_point: "미확인",
        work_measurement: "미확인", special_health_exam: "미확인",
        managed_substance: "미확인", specially_managed: "미확인",
        h_codes: "", grade: "미확인", kosha_status: "조회 전", legal_basis: "미확인"
      });
      render();
    });

    el("btnDeleteSelected").addEventListener("click", () => {
      rows = rows.filter((r) => r.selected === false);
      render();
      setStatus("선택된 행을 삭제했습니다.");
    });

    el("btnExtract").addEventListener("click", async () => {
      const f = el("pdfInput").files[0];
      if (!f) {
        alert("PDF 파일을 먼저 선택해 주세요.");
        return;
      }
      setStatus("PDF 분석 중...");
      try {
        const fd = new FormData();
        fd.append("file", f);
        const res = await fetch("/api/extract", { method: "POST", body: fd });
        const data = await readJsonSafe(res);
        if (!res.ok) {
          throw new Error(data.detail || `요청 실패 (${res.status})`);
        }
        rows = (data.ingredients || []).map((item) => ({
          selected: true,
          cmr_c: "미확인",
          cmr_m: "미확인",
          cmr_r: "미확인",
          ...item
        }));
        render();
        setStatus(`추출 완료: ${rows.length}건 (${data.warning || ""})`);
      } catch (err) {
        setStatus("오류: " + err.message);
        alert("PDF 분석 오류: " + err.message);
      }
    });

    el("btnLookup").addEventListener("click", async () => {
      const targets = rows.filter((r) => r.selected !== false && (r.cas || "").trim());
      if (!targets.length) {
        alert("조회할 CAS No.가 있는 행을 선택해 주세요.");
        return;
      }
      setStatus(`KOSHA 조회 중 (${targets.length}건)...`);
      for (const r of targets) {
        const cas = r.cas.trim();
        try {
          const res = await fetch(`/api/kosha/${encodeURIComponent(cas)}`);
          const info = await readJsonSafe(res);
          if (!res.ok) {
            r.kosha_status = info.detail || "조회 오류";
            continue;
          }
          r.kosha_name = info.kosha_name ?? r.kosha_name;
          r.cmr_c = info.cmr_c ?? "미확인";
          r.cmr_m = info.cmr_m ?? "미확인";
          r.cmr_r = info.cmr_r ?? "미확인";
          r.exposure_limit = info.exposure_limit ?? "미확인";
          r.boiling_point = info.boiling_point ?? "미확인";
          r.work_measurement = info.work_measurement ?? "미확인";
          r.special_health_exam = info.special_health_exam ?? "미확인";
          r.managed_substance = info.managed_substance ?? "미확인";
          r.specially_managed = info.specially_managed ?? "미확인";
          r.h_codes = info.h_codes ?? "";
          r.grade = info.grade ?? "미확인";
          r.legal_basis = info.regulation_text ?? "미확인";
          r.kosha_status = info.status ?? "조회 완료";
        } catch (err) {
          r.kosha_status = "오류: " + err.message;
        }
      }
      render();
      setStatus("KOSHA 조회 완료");
    });

    async function downloadFile(url, filename) {
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rows })
        });
        if (!res.ok) {
          const errJson = await readJsonSafe(res);
          throw new Error(errJson.detail || "다운로드 실패");
        }
        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (err) {
        alert(err.message);
      }
    }

    el("btnExportXlsx").addEventListener("click", () => downloadFile("/api/export/xlsx", "msds_integrated.xlsx"));
    el("btnExportPdf").addEventListener("click", () => downloadFile("/api/export/pdf", "msds_integrated.pdf"));

    render();
  </script>
</body>
</html>
