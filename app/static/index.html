<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MSDS 성분 조회</title>
  <style>
    body { font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; margin: 20px; color: #222; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    input, button { padding: 8px 10px; font-size: 14px; }
    button { cursor: pointer; }
    .wrap { overflow-x: auto; border: 1px solid #ccc; }
    table { border-collapse: collapse; width: 100%; min-width: 1250px; font-size: 13px; }
    th, td { border: 1px solid #d5d5d5; padding: 6px 8px; text-align: left; }
    th { background: #f2f4f7; white-space: nowrap; }
    td input { width: 100%; box-sizing: border-box; border: 0; background: transparent; font-size: 13px; }
    #msg { margin: 8px 0 12px; font-size: 13px; color: #333; }
  </style>
</head>
<body>
  <div class="controls">
    <input id="processInput" placeholder="공정명" />
    <input id="productInput" placeholder="제품명" />
    <input id="pdfInput" type="file" accept="application/pdf" />
    <button id="extractBtn">PDF 분석 및 성분 추가</button>
    <button id="lookupBtn">선택 행 KOSHA 조회</button>
  </div>
  <div id="msg">준비됨</div>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="checkAll" /></th>
          <th>공정명</th>
          <th>제품명</th>
          <th>원본 MSDS 물질명</th>
          <th>화학물질명(필수)</th>
          <th>CAS번호</th>
          <th>TWA(ppm)값</th>
          <th>TWA(mg)값</th>
          <th>H-CODE값</th>
          <th>H-CODE등급</th>
          <th>CMR_C값</th>
          <th>CMR_M값</th>
          <th>CMR_R값</th>
          <th>끓는점</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const FIELDS = [
      "process",
      "product",
      "original_name",
      "chem_name",
      "cas",
      "twa_ppm",
      "twa_mg",
      "h_code",
      "h_grade",
      "cmr_c",
      "cmr_m",
      "cmr_r",
      "boiling_point"
    ];

    let rows = [];
    const $ = (id) => document.getElementById(id);

    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function render() {
      $("tbody").innerHTML = rows.map((r, idx) => `
        <tr>
          <td><input type="checkbox" data-chk="${idx}" ${r.selected ? "checked" : ""} /></td>
          ${FIELDS.map((f) => `
            <td><input data-idx="${idx}" data-field="${f}" value="${esc(r[f] ?? "")}" /></td>
          `).join("")}
        </tr>
      `).join("");
    }

    $("checkAll").addEventListener("change", (e) => {
      rows.forEach((r) => { r.selected = e.target.checked; });
      render();
    });

    $("tbody").addEventListener("change", (e) => {
      if (e.target.dataset.chk !== undefined) {
        rows[+e.target.dataset.chk].selected = e.target.checked;
      }
    });

    $("tbody").addEventListener("input", (e) => {
      const idx = e.target.dataset.idx;
      const field = e.target.dataset.field;
      if (idx !== undefined && field) {
        rows[+idx][field] = e.target.value;
      }
    });

    $("extractBtn").addEventListener("click", async () => {
      const file = $("pdfInput").files[0];
      const processVal = $("processInput").value.trim();
      const productVal = $("productInput").value.trim();
      if (!file) {
        $("msg").textContent = "PDF 파일을 선택해 주세요.";
        return;
      }
      $("msg").textContent = "PDF 분석 중...";
      const fd = new FormData();
      fd.append("file", file);
      try {
        const res = await fetch("/api/extract", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "PDF 분석 실패");
        (data.items || []).forEach((it) => {
          rows.push({
            selected: true,
            process: processVal,
            product: productVal,
            original_name: it.original_name || "",
            chem_name: "",
            cas: it.cas || "",
            twa_ppm: "",
            twa_mg: "",
            h_code: "",
            h_grade: "",
            cmr_c: "",
            cmr_m: "",
            cmr_r: "",
            boiling_point: ""
          });
        });
        render();
        $("msg").textContent = `${(data.items || []).length}개 성분을 추가했습니다.`;
      } catch (err) {
        $("msg").textContent = err.message;
      }
    });

    $("lookupBtn").addEventListener("click", async () => {
      const targets = rows.filter((r) => r.selected && r.cas.trim());
      if (!targets.length) {
        $("msg").textContent = "조회할 체크된 CAS번호 행이 없습니다.";
        return;
      }
      for (let i = 0; i < targets.length; i++) {
        const row = targets[i];
        const cas = row.cas.trim();
        $("msg").textContent = `KOSHA 조회 중 (${i + 1}/${targets.length}): ${cas}`;
        try {
          const res = await fetch("/api/lookup/" + encodeURIComponent(cas));
          const d = await res.json();
          if (!res.ok) throw new Error(d.detail || "조회 실패");
          row.chem_name = d.chem_name || "";
          row.twa_ppm = d.twa_ppm || "";
          row.twa_mg = d.twa_mg || "";
          row.h_code = d.h_code || "";
          row.h_grade = d.h_grade || "";
          row.cmr_c = d.cmr_c || "";
          row.cmr_m = d.cmr_m || "";
          row.cmr_r = d.cmr_r || "";
          row.boiling_point = (row.twa_ppm || "").trim() ? (d.boiling_point || "") : "";
        } catch (err) {
          row.chem_name = `오류: ${err.message}`;
        }
        render();
      }
      $("msg").textContent = "선택 행 KOSHA 조회가 완료되었습니다.";
    });

    render();
  </script>
</body>
</html>
